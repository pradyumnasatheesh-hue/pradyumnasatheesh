<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prady Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat+Brush&family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sketchbook page. Left-aligned big type, one hand-drawn layer (buttons, marks, notes) on top of a quiet grid of real content. */
:root{
  --paper:#F6F2EA; --sand:#E9E3D6; --line:#DDD6C8; --ink:#1A1A1A; --head:#333333;
  --soft:#6A655C; --dim:#A39D90; --red:#B3263A; --red-deep:#8F1D2E; --red-tint:#F3D6DA; --white:#FFFFFF;
  --blue-tint:#E7ECF7; --blue:#1D4ED8; --teal-tint:#E6F2F0; --teal:#0F766E;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:Caveat,"Segoe Print","Comic Sans MS",cursive;
  --brush:"Caveat Brush",Caveat,"Segoe Print",cursive;
  color-scheme:light;
}
html{scroll-behavior:smooth}
main{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;overflow-x:hidden}
*{box-sizing:border-box}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(64px,9vw,120px)}
h1,h2,h3,p,figure,blockquote{margin:0}
.display{font-size:clamp(38px,5.4vw,68px);line-height:1.07;letter-spacing:-0.03em;font-weight:600;color:var(--head);text-wrap:balance}
.title{font-size:clamp(32px,4vw,48px);line-height:1.08;letter-spacing:-0.03em;font-weight:600;color:var(--head);text-wrap:balance}
.hl{background:url(a/brush.svg) center/100% 100% no-repeat;color:var(--white);padding:0 .18em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ul{background:url(a/underline.svg) bottom/100% .26em no-repeat;padding-bottom:.12em}
.note{font-family:var(--hand);font-weight:600;font-size:24px;line-height:1.15;color:var(--soft)}
.note.red{color:var(--red)}

/* hand-drawn buttons */
.hb{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;font:400 21px var(--brush);color:var(--ink);text-decoration:none;background:url(a/btn.svg) center/100% 100% no-repeat;border:0;cursor:pointer;white-space:nowrap;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.hb:hover{background-image:url(a/btn-hover.svg);transform:rotate(-1.5deg)}
.hb:active{transform:rotate(-1.5deg) scale(.96)}
.hb.on{background-image:url(a/btn-soft.svg);color:var(--ink)}
.tx{font:600 16px var(--sans);color:var(--soft);text-decoration:none;background:url(a/underline.svg) bottom/0% .3em no-repeat;border:0;padding:8px 2px 9px;margin:0 8px;cursor:pointer;transition:color .2s,background-size .3s}
.tx:hover,.tx.on{color:var(--ink);background-size:100% .3em}
.hb.on:hover{transform:rotate(1.5deg)}
.hb.big{min-height:56px;padding:0 32px;font-size:25px}
.hb.sm{min-height:40px;padding:0 16px;font-size:19px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 13px;font:500 14.5px var(--sans);color:var(--soft);border:1.5px solid var(--line);border-radius:999px;background:rgba(255,255,255,.5)}

/* nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px}
.mark{font-size:30px;font-weight:800;letter-spacing:-0.06em;text-decoration:none}
.mark i{font-style:normal;color:var(--red)}
.nav nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:clamp(24px,5vw,64px) 0}
.hero .copy{display:flex;flex-direction:column;gap:18px;padding-bottom:clamp(24px,5vw,64px)}
.hero img{width:min(100%,400px);height:auto;justify-self:end;display:block}
.facts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.rule{border-top:1.5px solid var(--line)}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:4px 6px;margin:22px 0 10px -8px}
.workgrid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,440px);align-items:start}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;min-height:92px;padding:14px 0;border-bottom:1.5px solid var(--line);text-decoration:none;color:var(--dim);transition:color .2s}
.row .t{font-size:clamp(22px,2.5vw,31px);font-weight:600;letter-spacing:-0.03em;line-height:1.12;min-width:0}
.row .st{flex:none;font:600 19px var(--hand);color:var(--red)}
.row.on{color:var(--ink)}
.row .mini{display:none}
.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire path{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round}
.wire circle{fill:var(--red)}
.preview{grid-column:3;position:sticky;top:24px;background:var(--white);border:1.5px solid var(--ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(26,26,26,.09)}
.preview .who{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.preview .org{font-weight:600;font-size:15px}
.preview .blurb{font-size:16px;line-height:1.45;color:#45413A}
.preview .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.metric{font-size:19px;font-weight:800;letter-spacing:-0.03em;color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.swap{animation:swap .28s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;background:var(--ink);color:var(--white);font:400 18px var(--brush);padding:5px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .15s}
.chip.show{opacity:1}

/* work rows with looping snippets */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(36px,5vw,64px)}
.wrow.flip .wtext{order:2}
.wtext{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.wtitle{font-size:clamp(26px,3.2vw,40px);line-height:1.1;letter-spacing:-0.03em;font-weight:600;color:var(--head);text-wrap:balance;text-decoration:none}
.wmeta{font-size:16px;color:var(--dim)}
.snip{position:relative;aspect-ratio:16/10.5;border-radius:26px;background:var(--white);box-shadow:0 2px 0 var(--line),0 26px 60px rgba(26,26,26,.13);overflow:hidden;transform:rotate(1.6deg);transition:transform .35s cubic-bezier(.3,1.4,.5,1);display:block;text-decoration:none;color:inherit;font-family:"DM Sans",var(--sans)}
.wrow.flip .snip{transform:rotate(-1.6deg)}
.snip:hover,.wrow.flip .snip:hover{transform:rotate(0) scale(1.015)}
.veil{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(246,242,234,0);transition:background .25s;pointer-events:none}
.tip{background:var(--ink);color:var(--white);font:400 21px var(--brush);padding:9px 20px;border-radius:999px;opacity:0;transform:translateY(8px) rotate(-2deg);transition:opacity .25s,transform .25s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
.snip:hover .veil,.snip:focus-visible .veil{background:rgba(246,242,234,.62)}
.snip:hover .tip,.snip:focus-visible .tip{opacity:1;transform:rotate(-2deg)}
@media (hover:none){.veil{align-items:flex-end;justify-content:flex-start;padding:12px}.tip{opacity:1;transform:none;font-size:17px;padding:6px 14px}}
.snip .stagein{position:absolute;inset:0;padding:18px;display:flex;gap:12px}
.a{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s cubic-bezier(.3,1.3,.5,1)}
.a.on{opacity:1;transform:none}
.grow{transition:width .9s cubic-bezier(.3,1,.4,1)}
.cur{position:absolute;width:22px;height:22px;z-index:5;transition:left .7s cubic-bezier(.5,0,.2,1),top .7s cubic-bezier(.5,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.dxb{background:#F3F4F6;font-size:11px;color:#1F2937}
.dxh{display:flex;align-items:center;gap:12px;height:34px;padding:0 14px;background:#fff;border-bottom:1px solid #E5E7EB;font-size:11px;color:#6B7280}
.dxh b{font-size:16px;font-weight:800;letter-spacing:-.05em;color:#111827}
.wab{align-self:flex-end;max-width:92%;background:#D9FDD3;border-radius:10px 2px 10px 10px;padding:7px 9px;font-size:11px;line-height:1.35;color:#111B21;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.sigc{background:#fff;border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(17,24,39,.08)}
.eye{font-size:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#4B5563}
.chipx{font-size:9px;font-weight:600;padding:2px 7px;border-radius:999px;background:#EEF2FF;color:#3730A3}
.prow{position:relative;height:20px;display:flex;align-items:center;gap:6px;padding-left:6px;font-size:10px;margin-top:3px}
.prow i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.prow span{position:relative}
.aib{font-size:10.5px;line-height:1.4;background:#FAF5FF;border:1px solid #E9D5FF;border-radius:8px;padding:7px 9px}
.aib em{font-style:normal;font-size:8px;font-weight:800;letter-spacing:.06em;background:#9333EA;color:#fff;border-radius:3px;padding:2px 5px;margin-right:6px}
.btnk{font:700 11px "DM Sans",sans-serif;padding:7px 10px;border-radius:7px;background:#1A1A1A;color:#fff;white-space:nowrap;transition:transform .15s}
.btnk.press{transform:scale(.92)}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,16px);background:#14532D;color:#fff;font:600 11.5px "DM Sans",sans-serif;padding:8px 14px;border-radius:999px;opacity:0;transition:.4s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* frame zero: the headline inks itself in */
.ink-h{font-size:clamp(30px,5.2vw,60px);line-height:1.1;letter-spacing:-0.03em;font-weight:600;color:var(--head);max-width:17em;margin:0 auto;text-wrap:balance}
.ink-h span{opacity:.1;transition:opacity .5s ease}
.ink-h span.half{opacity:.45}
.ink-h span.full{opacity:1}
.ink-h .brushed{opacity:1;background:url(a/brush.svg) left center/0% 100% no-repeat;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .8s cubic-bezier(.6,0,.2,1),color .5s ease .25s}
.ink-h .brushed.on{background-size:100% 100%;color:var(--white)}
.ink-h .brushed.on span{opacity:1}
.late{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.late.on{opacity:1;transform:none}

/* idea sketches (drawn, not real screens) */
.mock{position:relative;height:250px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;padding:16px}
.mock .cap{position:absolute;left:12px;bottom:8px;font:600 16px var(--hand);color:var(--soft)}
.pane{background:var(--white);border:2px solid var(--ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;font-size:11px;line-height:1.3}
.pane b{font-size:12.5px;letter-spacing:-0.01em}
.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:7px;border:1.3px solid var(--line);font-weight:600;font-size:10.5px;white-space:nowrap}
.pill.k{background:var(--ink);color:var(--white);border-color:var(--ink)}
.pill.r{background:var(--red-tint);border-color:var(--red);color:var(--red-deep)}
.pill.b{background:var(--blue-tint);border-color:var(--blue-tint);color:#1E3A8A}
.bar{height:8px;border-radius:4px;background:var(--sand)}
.phone{width:112px;border:5px solid var(--ink);border-radius:22px;background:var(--white);padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;font-weight:600}
.rec{width:44px;height:44px;border-radius:50%;background:var(--red)}
.cols{display:flex;align-items:flex-end;gap:5px;height:60px}
.cols span{width:16px;border-radius:3px;background:var(--dim)}

/* how I work: a dial you can drag */
.how{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center}
.dialwrap{position:relative;width:100%;max-width:520px;margin:0 auto}
.dial{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .knob{cursor:grab;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.dial.drag .knob{cursor:grabbing;transition:none}
.dial .lab{position:absolute;transform:translate(-50%,-50%);font:400 24px var(--brush);color:var(--dim);background:none;border:0;padding:6px 10px;cursor:pointer;transition:color .2s,transform .2s}
.dial .lab.cur{color:var(--ink);transform:translate(-50%,-50%) scale(1.18) rotate(-2deg)}
.dialwrap .core{position:absolute;inset:31% 27%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;pointer-events:none}
.dialwrap .core b{font-size:clamp(15px,1.5vw,18px);font-weight:600;letter-spacing:-0.02em;line-height:1.25}

/* words: a deck of notes */
.deckrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(28px,5vw,72px);align-items:center}
.deck{display:grid;padding:20px 34px 44px}
.deck figure{grid-area:1/1;background:var(--white);border:1.5px solid var(--ink);border-radius:20px;padding:clamp(24px,3.4vw,40px);display:flex;flex-direction:column;gap:18px;box-shadow:0 14px 34px rgba(26,26,26,.12);transition:transform .5s cubic-bezier(.3,1.2,.4,1),opacity .4s;cursor:pointer;transform-origin:50% 100%}
.deck figure::before{content:"";position:absolute}
.deck .qm{font:400 64px/0.6 var(--brush);color:var(--red);height:26px}
.deck blockquote{font-size:clamp(19px,2.1vw,25px);line-height:1.38;font-weight:500;letter-spacing:-0.015em}
.deck figcaption{font-size:15px;color:var(--soft);margin-top:auto}
.deck figcaption b{color:var(--ink);display:block;font-size:17px}
.arrows{display:flex;align-items:center;gap:12px;margin-top:22px}
.arrows button{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);background:var(--white);padding:0;cursor:pointer;transition:transform .15s}
.arrows button:hover{transform:scale(1.08)}

/* about band */
.aboutband{background-color:var(--sand);background-image:radial-gradient(#D3CBBB 1.2px,transparent 1.2px);background-size:26px 26px}
.about{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:center}
.say{font-size:clamp(30px,4.2vw,54px);line-height:1.1;letter-spacing:-0.03em;font-weight:600;text-wrap:balance}
.say span{color:#B9B1A2;transition:color .35s}
.say span.lit{color:var(--head)}
.stages{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px}
.portrait{position:relative;justify-self:center;width:min(100%,360px)}
.portrait::before{content:"";position:absolute;left:8%;right:4%;top:6%;bottom:0;border-radius:48% 52% 44% 56%/52% 46% 54% 48%;background:#F6CF7A;transform:rotate(-4deg)}
.portrait img{position:relative;display:block;width:100%;height:auto;animation:bob 5s ease-in-out infinite}
.portrait .note{position:absolute;color:var(--ink);white-space:nowrap}
@keyframes bob{50%{transform:translateY(-6px) rotate(.6deg)}}

/* finish */
.finish{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center}
.finish img{width:clamp(150px,20vw,230px);height:auto}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
.addr{font-size:clamp(18px,2.2vw,24px);font-weight:600;letter-spacing:-0.02em;user-select:all;overflow-wrap:anywhere}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:22px;border-top:1.5px solid var(--line);font-size:15px;color:var(--soft)}

/* frame zero */
.intro{position:fixed;inset:0;z-index:50;background-color:var(--paper);background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:26px 26px;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:transform .7s cubic-bezier(.7,0,.2,1)}
.intro.leave{transform:translateY(-102%)}
.intro .top{display:flex;justify-content:space-between;align-items:center}
.intro .mid{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:0}
.intro .me{width:min(46vw,250px);height:auto;transform-origin:50% 90%}
.intro .me.wave{animation:wave .7s ease-in-out 2}
@keyframes wave{50%{transform:rotate(-4deg)}}
.stagebox{position:relative;width:100%;max-width:640px;min-height:220px}
.stagebox>div{position:absolute;inset:0 0 auto 0;display:flex;flex-direction:column;align-items:center;gap:16px}
.load{width:min(340px,80%);height:30px;background:url(a/btn.svg) center/100% 100% no-repeat;padding:6px 9px}
.load i{display:block;height:100%;width:0;background:url(a/brush.svg) left center/322px 100% no-repeat;animation:fill 2.6s cubic-bezier(.6,.05,.3,1) .15s forwards}
@keyframes fill{to{width:100%}}
.fadeup{animation:swap .5s ease both}
.intro h1{font-size:clamp(36px,6vw,62px);line-height:1.08;letter-spacing:-0.03em;font-weight:600;color:var(--head)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}.hero img{justify-self:center;width:min(70%,300px);order:-1}.hero .copy{padding-bottom:28px}
  .wrow,.wrow.flip{grid-template-columns:1fr}.wrow.flip .wtext{order:0}.snip,.wrow.flip .snip{transform:none}
  .row{flex-direction:column;align-items:stretch;color:var(--ink);gap:10px;padding:18px 0}
  .row .mini{display:block}.row .mini .mock{height:200px}
  .how,.about,.deckrow{grid-template-columns:1fr}.deck{padding:16px 22px 44px}.dialwrap{max-width:330px}.dial .lab{font-size:18px;padding:2px}.dialwrap .core{position:static;min-height:150px;padding-top:8px}.dialwrap .core b{font-size:18px}
  .finish{grid-template-columns:1fr}
  .loop{width:calc(100% - 96px)}
  .nav .hb{min-height:42px;padding:0 14px;font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

</head>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
